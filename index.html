<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071311">
<title>5 Kalme Kids</title>
<link rel="manifest" href="app.webmanifest">
<style>
:root{
  --bg:#071311;--panel:#0c1d1a;--panel2:#102723;--line:rgba(255,255,255,.08);
  --text:#f7f5ee;--muted:#93aaa4;--mint:#69e0bd;--mint2:#27b98e;--gold:#f4d57b;
  --shadow:0 24px 80px rgba(0,0,0,.34)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
 radial-gradient(circle at 20% -10%,rgba(49,154,124,.16),transparent 30%),
 radial-gradient(circle at 95% 10%,rgba(244,213,123,.07),transparent 24%),
 var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:
 radial-gradient(circle at 1px 1px,rgba(255,255,255,.14) 1px,transparent 0);background-size:28px 28px;mask-image:linear-gradient(to bottom,#000,transparent 72%)}
button,input{font:inherit}.app{max-width:920px;margin:auto;padding:14px 12px 40px}
.top{position:sticky;top:0;z-index:30;padding:8px 0 12px;background:linear-gradient(180deg,rgba(7,19,17,.98),rgba(7,19,17,.88),transparent);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandLeft{display:flex;align-items:center;gap:11px}.mark{width:42px;height:42px;border:1px solid rgba(105,224,189,.25);border-radius:14px;background:linear-gradient(145deg,#12372f,#0a201c);display:grid;place-items:center;box-shadow:inset 0 1px rgba(255,255,255,.08);font-size:20px}
.brand h1{font-size:18px;line-height:1;margin:0;letter-spacing:-.2px}.brand p{font-size:11px;color:var(--muted);margin:5px 0 0}.liveTag{border:1px solid rgba(105,224,189,.18);background:rgba(105,224,189,.07);border-radius:999px;padding:7px 10px;font-size:10px;color:#b9e9da}
.nav{display:flex;gap:7px;overflow:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.tab{min-width:74px;border:1px solid var(--line);border-radius:13px;padding:9px 8px;background:rgba(255,255,255,.025);color:#cfe0db;font-weight:800;font-size:12px;transition:.22s ease}.tab small{display:block;color:#708e86;font-weight:650;font-size:9px;margin-top:2px}.tab.active{background:linear-gradient(135deg,rgba(39,185,142,.2),rgba(105,224,189,.08));border-color:rgba(105,224,189,.35);color:#fff;box-shadow:0 8px 26px rgba(39,185,142,.08)}
.shell{border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,rgba(16,39,35,.84),rgba(9,25,22,.92));box-shadow:var(--shadow);overflow:hidden}
.meta{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;gap:10px}.meta h2{margin:0;font-size:17px}.meta .sub{font-size:10px;color:var(--muted);margin-top:3px}.count{font-size:10px;color:#9db7b0;border:1px solid var(--line);padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.025)}
.stageWrap{padding:8px 14px 14px}.stage{position:relative;min-height:330px;border:1px solid rgba(255,255,255,.07);border-radius:24px;display:grid;place-items:center;overflow:hidden;background:
 radial-gradient(circle at 50% 38%,rgba(105,224,189,.13),transparent 30%),
 linear-gradient(180deg,#0d2420,#091a17)}
.stage:before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;border:1px solid rgba(105,224,189,.08);box-shadow:0 0 0 42px rgba(105,224,189,.018),0 0 0 86px rgba(105,224,189,.012)}
.stage:after{content:"☾";position:absolute;right:18px;top:12px;color:rgba(244,213,123,.22);font-size:38px}
.speaker{position:absolute;left:16px;top:15px;display:flex;align-items:center;gap:7px;color:#9eb7b0;font-size:10px}.pulse{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(105,224,189,.35);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(105,224,189,.28)}70%{box-shadow:0 0 0 9px rgba(105,224,189,0)}100%{box-shadow:0 0 0 0 rgba(105,224,189,0)}}
.focus{position:relative;z-index:2;width:min(90%,720px);padding:44px 18px 28px;text-align:center;transform-origin:center;transition:opacity .18s ease,transform .22s cubic-bezier(.2,.75,.2,1),filter .18s ease}
.focus.swapOut{opacity:0;transform:translateY(10px) scale(.965);filter:blur(7px)}
.focus.swapIn{animation:focusIn .34s cubic-bezier(.18,.8,.25,1)}
@keyframes focusIn{0%{opacity:0;transform:translateY(-9px) scale(.96);filter:blur(8px)}100%{opacity:1;transform:none;filter:none}}
.kind{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:6px 9px;color:#8eaaa2;font-size:9px;letter-spacing:.7px;text-transform:uppercase;background:rgba(0,0,0,.12)}
.arabicWord{direction:rtl;font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;font-size:clamp(48px,11vw,92px);font-weight:700;line-height:1.38;margin-top:14px;text-shadow:0 10px 34px rgba(0,0,0,.26)}
.urduWord{direction:rtl;font-family:"Noto Naskh Arabic","Noto Nastaliq Urdu","Traditional Arabic",serif;font-size:clamp(34px,8vw,64px);font-weight:700;line-height:1.55;margin-top:14px}
.romanWord{font-size:clamp(18px,4.4vw,27px);font-weight:800;letter-spacing:.1px;margin-top:8px}.meaning{font-size:12px;color:#8fa8a1;margin-top:7px;line-height:1.55}
.waiting .arabicWord,.waiting .urduWord{font-size:32px}.waiting .romanWord{font-size:15px;font-weight:650;color:#a6bbb5}
.player{margin-top:12px;border:1px solid var(--line);border-radius:20px;padding:13px;background:rgba(0,0,0,.12)}
.playRow{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center}.play{width:52px;height:52px;border:0;border-radius:17px;background:linear-gradient(145deg,var(--mint2),#19785f);color:#fff;font-size:20px;box-shadow:0 10px 24px rgba(39,185,142,.17)}.trackTitle{font-size:13px;font-weight:850}.trackSub{font-size:10px;color:#7f9b93;margin-top:3px}.timeline{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:8px;margin-top:12px;color:#718d85;font-size:10px}.timeline input{width:100%;accent-color:var(--mint)}.actions{display:flex;gap:7px;overflow:auto;margin-top:11px;padding-bottom:2px;scrollbar-width:none}.actions::-webkit-scrollbar{display:none}.action{white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.025);color:#bfd2cd;border-radius:12px;padding:8px 10px;font-weight:750;font-size:10px}.action.active{border-color:rgba(105,224,189,.32);background:rgba(105,224,189,.09);color:#eafff8}
.fullText{margin-top:12px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.018);padding:14px}.label{font-size:9px;color:#6f8c84;letter-spacing:.8px;text-transform:uppercase;margin-bottom:7px}.fullArabic{direction:rtl;text-align:center;font-family:"Noto Naskh Arabic","Traditional Arabic",serif;font-size:30px;line-height:1.85;color:#f7f1df}.fullRoman{text-align:center;color:#adbfba;font-size:13px;line-height:1.7;margin-top:5px}
.notice{margin-top:10px;color:#748f88;font-size:10px;line-height:1.45;text-align:center}.ytHost{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;opacity:.01!important;pointer-events:none!important;left:-9999px!important;top:-9999px!important}
.footer{text-align:center;color:#526f67;font-size:9px;padding:18px 6px}
@media(max-width:600px){.app{padding-left:9px;padding-right:9px}.stage{min-height:315px}.stageWrap{padding:7px 9px 10px}.meta{padding-left:13px;padding-right:13px}.focus{padding-left:8px;padding-right:8px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="brandLeft"><div class="mark">☪</div><div><h1>5 Kalme Kids</h1><p>Listen • See • Repeat</p></div></div>
      <div class="liveTag">Focus Mode</div>
    </div>
    <nav class="nav" id="nav"></nav>
  </header>

  <main class="shell">
    <div class="meta"><div><h2 id="title"></h2><div class="sub" id="subtitle"></div></div><div class="count" id="count"></div></div>

    <div class="stageWrap">
      <section class="stage">
        <div class="speaker"><span class="pulse"></span><span id="speakerState">Ready</span></div>
        <div class="focus waiting" id="focus">
          <div class="kind" id="kind">Now speaking</div>
          <div class="arabicWord" id="arabicWord">بِسْمِ الله</div>
          <div class="urduWord" id="urduWord" style="display:none"></div>
          <div class="romanWord" id="romanWord">Play dabaiye</div>
          <div class="meaning" id="meaning">Jo audio me bolega, wahi yahan animation ke saath aayega.</div>
        </div>
      </section>

      <section class="player">
        <div class="playRow">
          <button class="play" id="play">▶</button>
          <div><div class="trackTitle" id="trackTitle"></div><div class="trackSub">Official YouTube voice • video hidden</div></div>
        </div>
        <div class="timeline"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
        <div class="actions">
          <button class="action" id="restart">↺ Restart</button>
          <button class="action active" data-speed="1">1×</button>
          <button class="action" data-speed=".75">0.75×</button>
          <button class="action active" id="focusMode">Focus animation: On</button>
          <a class="action" id="source" target="_blank" rel="noopener" style="text-decoration:none">Source ↗</a>
        </div>
      </section>

      <section class="fullText">
        <div class="label">Full Kalma</div>
        <div class="fullArabic" id="fullArabic"></div>
        <div class="fullRoman" id="fullRoman"></div>
      </section>
      <div class="notice" id="notice"></div>
    </div>
  </main>
  <div id="ytPlayer" class="ytHost"></div>
  <div class="footer">Website Preview • Minimal Focus UI • smooth word / narration animation</div>
</div>

<script>
const K=[
 {n:1,name:'Pehla Kalma Tayyibah',short:'Tayyibah',video:'jSoEVLNeHw0',
  ar:'لَا إِلٰهَ إِلَّا اللّٰهُ مُحَمَّدٌ رَّسُولُ اللّٰهِ',
  ro:'La ilaha illallahu, Muhammadur Rasoolullah.',
  cues:[
    {s:15.76,e:16.37,type:'arabic',a:'لَا',r:'La'},
    {s:16.37,e:17.17,type:'arabic',a:'إِلٰهَ',r:'ilaha'},
    {s:17.17,e:17.77,type:'arabic',a:'إِلَّا',r:'illa'},
    {s:17.77,e:18.54,type:'arabic',a:'اللّٰهُ',r:'llahu'},
    {s:18.54,e:19.29,type:'arabic',a:'مُحَمَّدٌ',r:'Muhammadur'},
    {s:19.29,e:19.89,type:'arabic',a:'رَّسُولُ',r:'Rasoolu'},
    {s:19.89,e:20.80,type:'arabic',a:'اللّٰهِ',r:'llah'},

    {s:26.00,e:27.60,type:'urdu',u:'ترجمہ',r:'Tarjuma'},
    {s:27.60,e:29.20,type:'urdu',u:'اللہ کے سوا',r:'Allah ke siwa'},
    {s:29.20,e:31.10,type:'urdu',u:'کوئی معبود نہیں',r:'koi mabood nahin'},
    {s:31.10,e:33.20,type:'urdu',u:'محمد ﷺ',r:'Muhammad ﷺ'},
    {s:33.20,e:36.10,type:'urdu',u:'اللہ کے رسول ہیں',r:'Allah ke Rasool hain'},
    {s:36.10,e:39.00,type:'pause',r:'Next recitation...'},

    {s:39.00,e:39.61,type:'arabic',a:'لَا',r:'La'},
    {s:39.61,e:40.41,type:'arabic',a:'إِلٰهَ',r:'ilaha'},
    {s:40.41,e:41.01,type:'arabic',a:'إِلَّا',r:'illa'},
    {s:41.01,e:41.78,type:'arabic',a:'اللّٰهُ',r:'llahu'},
    {s:41.78,e:42.53,type:'arabic',a:'مُحَمَّدٌ',r:'Muhammadur'},
    {s:42.53,e:43.13,type:'arabic',a:'رَّسُولُ',r:'Rasoolu'},
    {s:43.13,e:44.04,type:'arabic',a:'اللّٰهِ',r:'llah'},

    {s:44.34,e:44.95,type:'arabic',a:'لَا',r:'La'},
    {s:44.95,e:45.75,type:'arabic',a:'إِلٰهَ',r:'ilaha'},
    {s:45.75,e:46.35,type:'arabic',a:'إِلَّا',r:'illa'},
    {s:46.35,e:47.12,type:'arabic',a:'اللّٰهُ',r:'llahu'},
    {s:47.12,e:47.87,type:'arabic',a:'مُحَمَّدٌ',r:'Muhammadur'},
    {s:47.87,e:48.47,type:'arabic',a:'رَّسُولُ',r:'Rasoolu'},
    {s:48.47,e:49.38,type:'arabic',a:'اللّٰهِ',r:'llah'},

    {s:50.00,e:134.00,type:'narration',u:'اردو بیان',r:'Urdu narration',m:'Exact spoken-word caption timing is ready to be filled here without changing the UI.'}
  ]},
 {n:2,name:'Dusra Kalma Shahadat',short:'Shahadat',video:'54JnsbHQPbM',ar:'أَشْهَدُ أَنْ لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ',ro:'Ashhadu an la ilaha illallahu wahdahu la shareeka lahu, wa ashhadu anna Muhammadan abduhu wa rasooluhu.'},
 {n:3,name:'Teesra Kalma Tamjeed',short:'Tamjeed',video:'5ivzNZRs5IM',ar:'سُبْحَانَ اللّٰهِ وَالْحَمْدُ لِلّٰهِ وَلَا إِلٰهَ إِلَّا اللّٰهُ وَاللّٰهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰهِ الْعَلِيِّ الْعَظِيمِ',ro:'Subhanallahi walhamdu lillahi wa la ilaha illallahu wallahu akbar. Wa la hawla wa la quwwata illa billahil aliyyil azeem.'},
 {n:4,name:'Chautha Kalma Tauheed',short:'Tauheed',video:'d05LzqfnpmY',ar:'لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، يُحْيِي وَيُمِيتُ، وَهُوَ حَيٌّ لَا يَمُوتُ أَبَدًا أَبَدًا، ذُو الْجَلَالِ وَالْإِكْرَامِ، بِيَدِهِ الْخَيْرُ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ',ro:'La ilaha illallahu wahdahu la shareeka lah, lahul mulku wa lahul hamdu, yuhyi wa yumitu, wa huwa hayyun la yamutu abadan abada, zul jalali wal ikram, biyadihil khair, wa huwa ala kulli shai-in qadeer.'},
 {n:5,name:'Panchwa Kalma Astaghfar',short:'Astaghfar',video:'2WrQw-L53fU',ar:'أَسْتَغْفِرُ اللّٰهَ رَبِّي مِنْ كُلِّ ذَنْبٍ أَذْنَبْتُهُ عَمْدًا أَوْ خَطَأً، سِرًّا أَوْ عَلَانِيَةً، وَأَتُوبُ إِلَيْهِ مِنَ الذَّنْبِ الَّذِي أَعْلَمُ وَمِنَ الذَّنْبِ الَّذِي لَا أَعْلَمُ، إِنَّكَ أَنْتَ عَلَّامُ الْغُيُوبِ، وَسَتَّارُ الْعُيُوبِ، وَغَفَّارُ الذُّنُوبِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰهِ الْعَلِيِّ الْعَظِيمِ',ro:'Astaghfirullaha rabbi min kulli dhanbin adhnabtuhu amadan aw khata-an, sirran aw alaniyatan, wa atubu ilaihi minaz-zanbillazi alamu wa minaz-zanbillazi la alamu. Innaka anta allamul-ghuyubi, wa sattarul-uyubi, wa ghaffaruz-zunubi, wa la hawla wa la quwwata illa billahil aliyyil azeem.'}
];
const $=s=>document.querySelector(s);
let current=0,yt=null,ready=false,timer=null,lastCueKey='',focusOn=true,pending=K[0].video,swapTimer=null;
function fmt(v){v=Math.max(0,Math.floor(+v||0));return Math.floor(v/60)+':'+String(v%60).padStart(2,'0')}
function nav(){
 $('#nav').innerHTML=K.map((k,i)=>'<button class="tab '+(i===current?'active':'')+'" data-i="'+i+'">'+k.n+'<small>'+k.short+'</small></button>').join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchKalma(+b.dataset.i));
 setTimeout(()=>document.querySelector('.tab.active')?.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}),40);
}
function render(){
 const k=K[current];
 $('#title').textContent=k.name;$('#subtitle').textContent='Kids learning • single-focus reading';$('#count').textContent=k.n+' / 5';
 $('#trackTitle').textContent=k.name;$('#source').href='https://www.youtube.com/watch?v='+k.video;
 $('#fullArabic').textContent=k.ar;$('#fullRoman').textContent=k.ro;
 $('#notice').textContent=k.n===1?'Pehla Kalma me new Focus Animation enabled hai. Arabic aur Urdu dono same stage par appear honge.':'Minimal UI ready. Exact word timing is Kalma ke liye next timing pass me add hogi.';
 nav();showWaiting();
 if(ready){yt.cueVideoById(k.video);$('#speakerState').textContent='Ready'}else pending=k.video;
}
function showWaiting(){
 lastCueKey='';const f=$('#focus');f.classList.add('waiting');
 $('#kind').textContent='Now speaking';$('#arabicWord').style.display='block';$('#arabicWord').textContent='☾';
 $('#urduWord').style.display='none';$('#romanWord').textContent='Play dabaiye';$('#meaning').textContent='Audio ke saath current word yahan animate hoga.';
}
function cueFor(k,t){
 if(!k.cues)return null;
 return k.cues.find(c=>t>=c.s&&t<c.e)||null;
}
function swapCue(c){
 const key=c?JSON.stringify([c.s,c.e,c.type,c.a,c.u,c.r]):'none';
 if(key===lastCueKey)return;lastCueKey=key;
 const f=$('#focus');clearTimeout(swapTimer);f.classList.add('swapOut');f.classList.remove('swapIn');
 swapTimer=setTimeout(()=>{
   f.classList.remove('waiting');
   if(!c){
     $('#kind').textContent='Listening';$('#arabicWord').style.display='none';$('#urduWord').style.display='none';
     $('#romanWord').textContent='';$('#meaning').textContent='';
   }else if(c.type==='arabic'){
     $('#kind').textContent='Arabic';$('#arabicWord').style.display='block';$('#urduWord').style.display='none';
     $('#arabicWord').textContent=c.a||'';$('#romanWord').textContent=c.r||'';$('#meaning').textContent='Suno • dekho • saath bolo';
   }else if(c.type==='urdu'){
     $('#kind').textContent='Urdu';$('#arabicWord').style.display='none';$('#urduWord').style.display='block';
     $('#urduWord').textContent=c.u||'';$('#romanWord').textContent=c.r||'';$('#meaning').textContent='Audio narration';
   }else if(c.type==='narration'){
     $('#kind').textContent='Urdu narration';$('#arabicWord').style.display='none';$('#urduWord').style.display='block';
     $('#urduWord').textContent=c.u||'';$('#romanWord').textContent=c.r||'';$('#meaning').textContent=c.m||'';
   }else{
     $('#kind').textContent='Listen';$('#arabicWord').style.display='none';$('#urduWord').style.display='none';
     $('#romanWord').textContent=c.r||'';$('#meaning').textContent='';
   }
   f.classList.remove('swapOut');void f.offsetWidth;f.classList.add('swapIn');
 },145);
}
function switchKalma(i){current=i;lastCueKey='';render();window.scrollTo({top:0,behavior:'smooth'})}
window.onYouTubeIframeAPIReady=()=>{
 yt=new YT.Player('ytPlayer',{height:'1',width:'1',videoId:pending,playerVars:{playsinline:1,rel:0,controls:0},events:{
  onReady(){ready=true;$('#speakerState').textContent='Ready';startTimer()},
  onStateChange(e){if(e.data===YT.PlayerState.PLAYING){$('#play').textContent='❚❚';$('#speakerState').textContent='Playing'}else if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.CUED){$('#play').textContent='▶';$('#speakerState').textContent='Paused'}},
  onError(){ $('#speakerState').textContent='Voice unavailable' }
 }});
};
function startTimer(){clearInterval(timer);timer=setInterval(()=>{
 if(!ready)return;
 const k=K[current],t=yt.getCurrentTime?yt.getCurrentTime():0,d=yt.getDuration?yt.getDuration():0;
 $('#cur').textContent=fmt(t);$('#dur').textContent=fmt(d);if(d>0&&!$('#seek').matches(':active'))$('#seek').value=Math.round(t/d*1000);
 if(focusOn&&k.cues)swapCue(cueFor(k,t));
},55)}
$('#play').onclick=()=>{if(!ready)return;if(yt.getPlayerState()===YT.PlayerState.PLAYING)yt.pauseVideo();else yt.playVideo()};
$('#restart').onclick=()=>{if(!ready)return;lastCueKey='';yt.seekTo(0,true);yt.playVideo()};
$('#seek').oninput=()=>{if(!ready)return;lastCueKey='';yt.seekTo((+$('#seek').value/1000)*(yt.getDuration()||0),true)};
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-speed]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(ready)yt.setPlaybackRate(+b.dataset.speed)});
$('#focusMode').onclick=()=>{focusOn=!focusOn;$('#focusMode').classList.toggle('active',focusOn);$('#focusMode').textContent='Focus animation: '+(focusOn?'On':'Off');if(!focusOn)showWaiting();else lastCueKey=''};
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?v=4',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
