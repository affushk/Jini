<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#062f2a">
<title>5 Kalme Kids</title>
<link rel="manifest" href="app.webmanifest">
<style>
:root{--bg:#061916;--panel:#0b2f2a;--line:#245149;--text:#f8f5e8;--muted:#b9d0c9;--green:#2fb88f;--gold:#f4c95d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#12463f,#061916 38%,#03100e);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button{font:inherit}.app{max-width:980px;margin:auto;padding:10px 10px 34px}.hero{position:sticky;top:0;z-index:20;padding:10px 0 8px;background:linear-gradient(180deg,rgba(6,25,22,.99),rgba(6,25,22,.90),transparent);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:11px}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#0f6d5a,#31b58f);display:grid;place-items:center;font-size:24px}.brand h1{margin:0;font-size:21px}.sub{color:var(--muted);font-size:12px;margin-top:2px}
.nav{display:flex;gap:8px;overflow:auto;padding:8px 0 3px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.kbtn{min-width:90px;border:1px solid #2a5c52;background:#0b2d28;color:#d9ebe6;border-radius:14px;padding:10px 8px;text-align:center;font-weight:800}.kbtn small{display:block;color:#9fc1b8;font-size:10px;margin-top:2px}.kbtn.active{background:linear-gradient(135deg,#16735f,#239b7c);border-color:#35b99a}.kbtn.done::after{content:" ✓";color:#8ef0d0}
.card{background:linear-gradient(180deg,rgba(14,52,47,.97),rgba(8,34,31,.98));border:1px solid var(--line);border-radius:18px;margin-top:12px;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:15px 15px 0}.head h2{margin:0;font-size:19px}.mini{color:var(--muted);font-size:11px}.pill{border:1px solid #32675d;background:#0b302a;color:#d9eee8;border-radius:999px;padding:7px 10px;font-size:11px}.body{padding:14px}
.player{background:#08231f;border:1px solid #2c6358;border-radius:17px;padding:14px}.play{width:64px;height:64px;border:0;border-radius:50%;display:grid;place-items:center;margin:4px auto 10px;background:linear-gradient(135deg,#20a37f,#36c59a);color:#fff;font-size:28px}.voiceTitle{text-align:center;font-weight:850}.voiceSub{text-align:center;color:#a7c4bc;font-size:11px;margin-top:3px}.controls{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:11px}.ctrl{border:1px solid #347267;background:#0c302b;color:#fff;border-radius:11px;padding:9px 11px;font-weight:750}.ctrl.active{background:#1a7d67}.progress{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;margin-top:11px;color:#9fc1b8;font-size:11px}.progress input{width:100%;accent-color:#34c29a}.status{display:flex;justify-content:space-between;gap:8px;margin-top:10px;color:#acd0c6;font-size:11px}.lessonNote{margin-top:9px;padding:9px 11px;border:1px solid #386d62;border-radius:12px;color:#c8ded8;font-size:11px;line-height:1.45}
.arabicBox{margin-top:13px;background:linear-gradient(#fffaf0,#fff4d7);color:#14332c;border:2px solid rgba(244,201,93,.72);border-radius:18px;padding:18px 12px}.arabic{direction:rtl;text-align:center;font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;font-size:clamp(34px,7vw,55px);line-height:1.9;font-weight:700}.romanTitle{font-size:12px;font-weight:850;margin:15px 0 7px}.roman{background:#092a25;border:1px solid #285d52;border-radius:15px;padding:14px;font-size:18px;line-height:1.75}
.w{display:inline-block;padding:1px 4px;border-radius:9px;background:transparent;transition:background-color .20s ease,color .20s ease,box-shadow .20s ease,transform .20s ease}.w.on{background:var(--gold);color:#06231f;box-shadow:0 0 0 2px rgba(244,201,93,.14),0 0 14px rgba(244,201,93,.22);transform:scale(1.02)}
.follow{margin-top:10px;border:1px solid #2e665a;border-radius:12px;padding:9px 11px;color:#bcd8d1;font-size:11px}.options{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.toggle{border:1px solid #347267;background:#0c302b;color:white;border-radius:11px;padding:9px 11px;font-weight:750}.toggle.active{background:#1a7d67}
.progressCards{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:13px}.pt{border:1px solid #2e6359;background:#0a2b26;color:#dcece7;border-radius:12px;padding:9px;text-align:center}.pt.done{background:#135f50}.pt b{display:block}.pt span{font-size:10px;color:#9fc1b8}.ytHost{position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;opacity:.01;pointer-events:none;overflow:hidden}
.footer{text-align:center;color:#6f9990;font-size:11px;padding:18px 5px}
@media(max-width:560px){.arabicBox{padding:14px 9px}.roman{font-size:17px}.progressCards{grid-template-columns:repeat(5,minmax(76px,1fr));overflow:auto}.pt{min-width:76px}}
</style>
</head>
<body>
<div class="app">
<header class="hero">
  <div class="brand"><div class="logo">☪</div><div><h1>5 Kalme Kids</h1><div class="sub">Arabic • Roman Urdu • Kids Madani Channel voice</div></div></div>
  <div class="nav" id="nav"></div>
</header>

<section class="card">
  <div class="head"><div><h2 id="title"></h2><div class="mini" id="num"></div></div><div class="pill" id="short"></div></div>
  <div class="body">
    <div class="player">
      <div class="voiceTitle" id="voiceTitle"></div>
      <div class="voiceSub">Official YouTube voice stream • video hidden</div>
      <button class="play" id="play">▶</button>
      <div class="controls">
        <button class="ctrl" id="restart">↺ Restart</button>
        <button class="ctrl active" data-speed="1">1×</button>
        <button class="ctrl" data-speed=".75">0.75×</button>
        <button class="ctrl active" data-repeat="1">1×</button>
        <button class="ctrl" data-repeat="3">3×</button>
        <button class="ctrl" data-repeat="5">5×</button>
        <button class="ctrl" data-repeat="10">10×</button>
      </div>
      <div class="progress"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
      <div class="status"><span id="state">Ready</span><span id="repeatState">Repeat 1×</span></div>
      <div class="lessonNote" id="lessonNote"></div>
    </div>

    <div class="arabicBox"><div class="arabic" id="arabic"></div></div>
    <div class="romanTitle">ROMAN URDU</div>
    <div class="roman" id="roman"></div>
    <div class="follow" id="follow">Play dabaiye aur saath padhaiye.</div>

    <div class="options">
      <button class="toggle" id="autoNext">Auto Next: Off</button>
      <button class="toggle" id="markDone">✓ Mark Learned</button>
      <a id="source" target="_blank" rel="noopener" class="toggle" style="text-decoration:none">Source ↗</a>
    </div>
    <div class="progressCards" id="progressCards"></div>
  </div>
</section>
<div id="ytPlayer" class="ytHost"></div>
<div class="footer">Phase 2.1 • full voice sync • glow pause 0:26–0:39 • Phase 3 progress • Phase 4 APK</div>
</div>

<script>
const K=[
 {n:1,name:'Pehla Kalma Tayyibah',short:'Tayyibah',video:'jSoEVLNeHw0',
  ar:'لَا إِلٰهَ إِلَّا اللّٰهُ مُحَمَّدٌ رَّسُولُ اللّٰهِ',ro:'La ilaha illallahu, Muhammadur Rasoolullah.',
  clip:null,
  syncWindows:[
    {start:15.76,end:26.00,cycleStart:15.76},
    {start:39.00,end:134.00,cycleStart:39.00}
  ],
  words:[
   {a:'لَا',r:'La',s:15.76,e:16.37},{a:'إِلٰهَ',r:'ilaha',s:16.37,e:17.17},{a:'إِلَّا',r:'illa',s:17.17,e:17.77},
   {a:'اللّٰهُ',r:'llahu',s:17.77,e:18.54},{a:'مُحَمَّدٌ',r:'Muhammadur',s:18.54,e:19.29},{a:'رَّسُولُ',r:'Rasoolu',s:19.29,e:19.89},{a:'اللّٰهِ',r:'llah',s:19.89,e:20.80}
  ]},
 {n:2,name:'Dusra Kalma Shahadat',short:'Shahadat',video:'54JnsbHQPbM',ar:'أَشْهَدُ أَنْ لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ',ro:'Ashhadu an la ilaha illallahu wahdahu la shareeka lahu, wa ashhadu anna Muhammadan abduhu wa rasooluhu.'},
 {n:3,name:'Teesra Kalma Tamjeed',short:'Tamjeed',video:'5ivzNZRs5IM',ar:'سُبْحَانَ اللّٰهِ وَالْحَمْدُ لِلّٰهِ وَلَا إِلٰهَ إِلَّا اللّٰهُ وَاللّٰهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰهِ الْعَلِيِّ الْعَظِيمِ',ro:'Subhanallahi walhamdu lillahi wa la ilaha illallahu wallahu akbar. Wa la hawla wa la quwwata illa billahil aliyyil azeem.'},
 {n:4,name:'Chautha Kalma Tauheed',short:'Tauheed',video:'d05LzqfnpmY',ar:'لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، يُحْيِي وَيُمِيتُ، وَهُوَ حَيٌّ لَا يَمُوتُ أَبَدًا أَبَدًا، ذُو الْجَلَالِ وَالْإِكْرَامِ، بِيَدِهِ الْخَيْرُ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ',ro:'La ilaha illallahu wahdahu la shareeka lah, lahul mulku wa lahul hamdu, yuhyi wa yumitu, wa huwa hayyun la yamutu abadan abada, zul jalali wal ikram, biyadihil khair, wa huwa ala kulli shai-in qadeer.'},
 {n:5,name:'Panchwa Kalma Astaghfar',short:'Astaghfar',video:'2WrQw-L53fU',ar:'أَسْتَغْفِرُ اللّٰهَ رَبِّي مِنْ كُلِّ ذَنْبٍ أَذْنَبْتُهُ عَمْدًا أَوْ خَطَأً، سِرًّا أَوْ عَلَانِيَةً، وَأَتُوبُ إِلَيْهِ مِنَ الذَّنْبِ الَّذِي أَعْلَمُ وَمِنَ الذَّنْبِ الَّذِي لَا أَعْلَمُ، إِنَّكَ أَنْتَ عَلَّامُ الْغُيُوبِ، وَسَتَّارُ الْعُيُوبِ، وَغَفَّارُ الذُّنُوبِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰهِ الْعَلِيِّ الْعَظِيمِ',ro:'Astaghfirullaha rabbi min kulli dhanbin adhnabtuhu amadan aw khata-an, sirran aw alaniyatan, wa atubu ilaihi minaz-zanbillazi alamu wa minaz-zanbillazi la alamu. Innaka anta allamul-ghuyubi, wa sattarul-uyubi, wa ghaffaruz-zunubi, wa la hawla wa la quwwata illa billahil aliyyil azeem.'}
];
const q=s=>document.querySelector(s);
let cur=0,yt=null,ready=false,timer=null,repeatTarget=1,repeatDone=0,autoNext=false,lastWord=-1;
let learned=JSON.parse(localStorage.getItem('kalmaLearned')||'[false,false,false,false,false]');
function fmt(s){s=Math.max(0,Math.floor(+s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function renderNav(){
 q('#nav').innerHTML=K.map((k,i)=>'<button class="kbtn '+(i===cur?'active ':'')+(learned[i]?'done':'')+'" data-i="'+i+'">'+k.n+'<small>'+k.short+'</small></button>').join('');
 document.querySelectorAll('.kbtn').forEach(b=>b.onclick=()=>switchKalma(+b.dataset.i));
 q('#progressCards').innerHTML=K.map((k,i)=>'<button class="pt '+(learned[i]?'done':'')+'" data-p="'+i+'"><b>'+k.n+(learned[i]?' ✓':'')+'</b><span>'+k.short+'</span></button>').join('');
 document.querySelectorAll('.pt').forEach(b=>b.onclick=()=>switchKalma(+b.dataset.p));
 setTimeout(()=>q('.kbtn.active')?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}),50);
}
function renderText(){
 const k=K[cur];
 if(k.words){
  q('#arabic').innerHTML=k.words.map((w,i)=>'<span class="w" data-w="'+i+'">'+w.a+'</span>').join(' ');
  q('#roman').innerHTML=k.words.map((w,i)=>'<span class="w" data-w="'+i+'">'+w.r+'</span>').join(' ');
 }else{q('#arabic').textContent=k.ar;q('#roman').textContent=k.ro}
}
function getSyncHit(k,t){
 if(k.n!==1||!k.words||!k.syncWindows)return -1;
 const win=k.syncWindows.find(w=>t>=w.start&&t<w.end);
 if(!win)return -1;
 const cycleLen=5.34;
 const rel=(t-win.cycleStart)%cycleLen;
 const starts=[0,.61,1.41,2.01,2.78,3.53,4.13];
 const ends=[.61,1.41,2.01,2.78,3.53,4.13,5.04];
 for(let i=0;i<starts.length;i++) if(rel>=starts[i]&&rel<ends[i]) return i;
 return -1;
}
function render(){
 const k=K[cur];q('#title').textContent=k.name;q('#num').textContent='Kalma '+k.n+' of 5';q('#short').textContent=k.short;q('#voiceTitle').textContent=k.name+' voice';
 q('#source').href='https://www.youtube.com/watch?v='+k.video;
 q('#lessonNote').textContent=k.n===1?'Full voice mode: 0:26–0:39 Urdu explanation me glow band rahega. 0:39 ke baad word glow phir start hoga.':'Full voice mode. Word sync is Kalma ke liye next timing pass me add hoga.';
 renderText();renderNav();q('#markDone').classList.toggle('active',!!learned[cur]);q('#markDone').textContent=learned[cur]?'✓ Learned':'✓ Mark Learned';
 q('#seek').value=0;q('#cur').textContent='0:00';q('#dur').textContent='0:00';q('#follow').textContent='Play dabaiye aur saath padhaiye.';clearWord();
 if(ready){yt.cueVideoById(k.video);q('#state').textContent='Ready'}else pending=k.video;
}
function clearWord(){if(lastWord>=0)document.querySelectorAll('.w[data-w="'+lastWord+'"]').forEach(x=>x.classList.remove('on'));lastWord=-1}
function setWord(i){if(lastWord===i)return;clearWord();lastWord=i;if(i>=0)document.querySelectorAll('.w[data-w="'+i+'"]').forEach(x=>x.classList.add('on'))}
function switchKalma(i){cur=i;repeatDone=0;render();window.scrollTo({top:0,behavior:'smooth'})}
let pending=K[0].video;
window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player('ytPlayer',{height:'1',width:'1',videoId:pending,playerVars:{playsinline:1,rel:0,controls:0},events:{onReady(){ready=true;q('#state').textContent='Ready';startTimer()},onStateChange(e){if(e.data===YT.PlayerState.PLAYING){q('#play').textContent='❚❚';q('#state').textContent='Playing'}else if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.CUED){q('#play').textContent='▶';q('#state').textContent='Paused'}},onError(){q('#state').textContent='Voice unavailable'}}})};
function startTimer(){clearInterval(timer);timer=setInterval(()=>{
 if(!ready)return;
 const k=K[cur],t=yt.getCurrentTime()||0,d=yt.getDuration()||0;

 q('#cur').textContent=fmt(t);q('#dur').textContent=fmt(d);
 if(d>0)q('#seek').value=Math.round(t/d*1000);

 if(k.n===1&&k.words){
   const wi=getSyncHit(k,t);
   setWord(wi);
   if(t>=26&&t<39){
     q('#follow').textContent='Urdu explanation chal rahi hai — glow pause.';
   }else if(wi>=0){
     q('#follow').textContent=k.words[wi].r+' — isi word ko follow kijiye.';
   }else{
     q('#follow').textContent='Kalma voice ka wait…';
   }
 }

 if(k.clip){
   const [s,e]=k.clip;
   if(t>=e-.08&&yt.getPlayerState()===YT.PlayerState.PLAYING){
     repeatDone++;
     if(repeatDone<repeatTarget){yt.seekTo(s,true);yt.playVideo();q('#repeatState').textContent='Repeat '+(repeatDone+1)+'/'+repeatTarget}
     else{yt.pauseVideo();yt.seekTo(s,true);setWord(-1);learned[cur]=true;saveProgress();q('#repeatState').textContent='Done ✓';if(autoNext&&cur<K.length-1){setTimeout(()=>{switchKalma(cur+1);setTimeout(playCurrent,500)},450)}}
   }
 }
},60)}

function playCurrent(){if(!ready)return;const k=K[cur];if(k.clip){const [s,e]=k.clip,t=yt.getCurrentTime();if(t<s-.2||t>=e-.05)yt.seekTo(s,true);repeatDone=0;q('#repeatState').textContent='Repeat 1/'+repeatTarget}else{q('#repeatState').textContent='Full voice'}yt.playVideo()}
q('#play').onclick=()=>{if(!ready)return;if(yt.getPlayerState()===YT.PlayerState.PLAYING)yt.pauseVideo();else playCurrent()};
q('#restart').onclick=()=>{if(!ready)return;const k=K[cur];repeatDone=0;yt.seekTo(0,true);yt.playVideo()};
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-speed]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(ready)yt.setPlaybackRate(+b.dataset.speed)});
document.querySelectorAll('[data-repeat]').forEach(b=>b.onclick=()=>{repeatTarget=+b.dataset.repeat;repeatDone=0;document.querySelectorAll('[data-repeat]').forEach(x=>x.classList.remove('active'));b.classList.add('active');q('#repeatState').textContent='Repeat '+repeatTarget+'×'});
q('#seek').oninput=()=>{if(!ready)return;const v=+q('#seek').value/1000;yt.seekTo(v*(yt.getDuration()||0),true)};
q('#autoNext').onclick=()=>{autoNext=!autoNext;q('#autoNext').classList.toggle('active',autoNext);q('#autoNext').textContent='Auto Next: '+(autoNext?'On':'Off')};
q('#markDone').onclick=()=>{learned[cur]=!learned[cur];saveProgress();renderNav();q('#markDone').classList.toggle('active',learned[cur]);q('#markDone').textContent=learned[cur]?'✓ Learned':'✓ Mark Learned'};
function saveProgress(){localStorage.setItem('kalmaLearned',JSON.stringify(learned));renderNav()}
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?v=3',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
