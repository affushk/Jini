function wordCues(start,end,type,display,roman){
  const d=(display||'').trim().split(/\s+/);
  const r=(roman||'').trim().split(/\s+/);
  if(!d.length)return[];
  const weights=d.map((w,i)=>Math.max(1,(r[i]||w).replace(/[^\p{L}\p{N}]/gu,'').length));
  const total=weights.reduce((a,b)=>a+b,0), span=end-start;
  let t=start;
  return d.map((w,i)=>{
    const dur=i===d.length-1?end-t:span*(weights[i]/total);
    const out={s:+t.toFixed(3),e:+Math.min(end,t+dur).toFixed(3),type};
    if(type==='arabic') out.a=w; else out.u=w;
    out.r=r[i]||'';
    t+=dur;
    return out;
  });
}

const $=s=>document.querySelector(s);
let current=0,yt=null,ready=false,timer=null,lastCueKey='',focusOn=true,pending=K[0].video,swapTimer=null;
function fmt(v){v=Math.max(0,Math.floor(+v||0));return Math.floor(v/60)+':'+String(v%60).padStart(2,'0')}
function nav(){
 $('#nav').innerHTML=K.map((k,i)=>'<button class="tab '+(i===current?'active':'')+'" data-i="'+i+'">'+k.n+'<small>'+k.short+'</small></button>').join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchKalma(+b.dataset.i));
 setTimeout(()=>document.querySelector('.tab.active')?.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}),40);
}
function render(){
 const k=K[current];
 $('#title').textContent=k.name;$('#subtitle').textContent='Kids learning • single-focus reading';$('#count').textContent=k.n+' / 5';
 $('#trackTitle').textContent=k.name;$('#source').href='https://www.youtube.com/watch?v='+k.video;
 $('#fullArabic').textContent=k.ar;$('#fullRoman').textContent=k.ro;
 $('#notice').textContent=k.n===1?'Pehla Kalma ka poora 2:13 audio transcript map ho gaya hai. Arabic, Urdu narration, tarjuma aur ending — sab current spoken word ke hisab se animate honge.':'Minimal UI ready. Exact word timing is Kalma ke liye next timing pass me add hogi.';
 nav();showWaiting();
 if(ready){yt.cueVideoById(k.video);$('#speakerState').textContent='Ready'}else pending=k.video;
}
function showWaiting(){
 lastCueKey='';const f=$('#focus');f.classList.add('waiting');
 $('#kind').textContent='Now speaking';$('#arabicWord').style.display='block';$('#arabicWord').textContent='☾';
 $('#urduWord').style.display='none';$('#romanWord').textContent='Play dabaiye';$('#meaning').textContent='Audio ke saath current word yahan animate hoga.';
}
function cueFor(k,t){
 if(!k.cues)return null;
 const exact=k.cues.find(c=>t>=c.s&&t<c.e);
 if(exact)return exact;

 // Tiny transcript gaps should not create a visible blank flash.
 let prev=null,next=null;
 for(const cue of k.cues){
   if(cue.e<=t)prev=cue;
   if(cue.s>t){next=cue;break}
 }
 if(prev&&next&&(next.s-prev.e)<=0.42&&t<next.s)return prev;
 return null;
}
let focusAnim=null;
function animateFocus(){
 const f=$('#focus');
 if(focusAnim)focusAnim.cancel();
 focusAnim=f.animate([
   {opacity:.68,transform:'translateY(5px) scale(.985)',filter:'blur(1.8px)'},
   {opacity:1,transform:'translateY(0) scale(1)',filter:'blur(0px)'}
 ],{duration:175,easing:'cubic-bezier(.2,.78,.2,1)',fill:'both'});
}
function swapCue(c){
 const key=c?JSON.stringify([c.s,c.e,c.type,c.a,c.u,c.r]):'none';
 if(key===lastCueKey)return;
 lastCueKey=key;
 const f=$('#focus');
 f.classList.remove('waiting');
 if(!c){
   $('#kind').textContent='Listening';
   $('#arabicWord').style.display='none';$('#urduWord').style.display='none';
   $('#romanWord').textContent='';$('#meaning').textContent='';
 }else if(c.type==='arabic'){
   $('#kind').textContent='Arabic';
   $('#arabicWord').style.display='block';$('#urduWord').style.display='none';
   $('#arabicWord').textContent=c.a||'';$('#romanWord').textContent=c.r||'';
   $('#meaning').textContent='Suno • dekho • saath bolo';
 }else if(c.type==='urdu'){
   $('#kind').textContent='Urdu / Tarjuma';
   $('#arabicWord').style.display='none';$('#urduWord').style.display='block';
   $('#urduWord').textContent=c.u||'';$('#romanWord').textContent=c.r||'';
   $('#meaning').textContent='Suno • dekho • saath bolo';
 }else{
   $('#kind').textContent='Listen';
   $('#arabicWord').style.display='none';$('#urduWord').style.display='none';
   $('#romanWord').textContent=c.r||'';$('#meaning').textContent='';
 }
 animateFocus();
}
function switchKalma(i){current=i;lastCueKey='';render();window.scrollTo({top:0,behavior:'smooth'})}
window.onYouTubeIframeAPIReady=()=>{
 yt=new YT.Player('ytPlayer',{height:'1',width:'1',videoId:pending,playerVars:{playsinline:1,rel:0,controls:0},events:{
  onReady(){ready=true;$('#speakerState').textContent='Ready';startTimer()},
  onStateChange(e){
   const playing=e.data===YT.PlayerState.PLAYING;
   $('.stage').classList.toggle('playing',playing);
   $('#play').classList.toggle('playing',playing);
   if(playing){$('#play').textContent='❚❚';$('#speakerState').textContent='Playing'}
   else if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.CUED||e.data===YT.PlayerState.ENDED){$('#play').textContent='▶';$('#speakerState').textContent=e.data===YT.PlayerState.ENDED?'Finished':'Paused'}
 },
  onError(){ $('#speakerState').textContent='Voice unavailable' }
 }});
};
function startTimer(){clearInterval(timer);timer=setInterval(()=>{
 if(!ready)return;
 const k=K[current],t=yt.getCurrentTime?yt.getCurrentTime():0,d=yt.getDuration?yt.getDuration():0;
 $('#cur').textContent=fmt(t);$('#dur').textContent=fmt(d);
 if(d>0&&!$('#seek').matches(':active')){
   const p=Math.max(0,Math.min(100,t/d*100));
   $('#seek').value=Math.round(p*10);
   $('#seek').style.setProperty('--p',p.toFixed(2)+'%');
 }
 if(focusOn&&k.cues)swapCue(cueFor(k,t));
},45)}
$('#play').onclick=()=>{if(!ready)return;if(yt.getPlayerState()===YT.PlayerState.PLAYING)yt.pauseVideo();else yt.playVideo()};
$('#restart').onclick=()=>{if(!ready)return;lastCueKey='';yt.seekTo(0,true);yt.playVideo()};
$('#seek').oninput=()=>{if(!ready)return;lastCueKey='';yt.seekTo((+$('#seek').value/1000)*(yt.getDuration()||0),true)};
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-speed]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(ready)yt.setPlaybackRate(+b.dataset.speed)});
$('#focusMode').onclick=()=>{focusOn=!focusOn;$('#focusMode').classList.toggle('active',focusOn);$('#focusMode').textContent='Focus animation: '+(focusOn?'On':'Off');if(!focusOn)showWaiting();else lastCueKey=''};
$('#fullTextToggle').onclick=()=>$('#fullTextCard').classList.toggle('compact');
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?v=4',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
