name: Fetch Kalma Transcript

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-transcript.yml'

jobs:
  transcript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public YouTube captions
        run: |
          pip -q install youtube-transcript-api
          python - <<'PY'
          from youtube_transcript_api import YouTubeTranscriptApi
          import json
          vid="jSoEVLNeHw0"
          api=YouTubeTranscriptApi()
          try:
              ts=api.list(vid)
              print("AVAILABLE:")
              for t in ts:
                  print(t.language_code, t.language, "generated=", t.is_generated, "translatable=", t.is_translatable)
              choices=[]
              for code in ["ur","hi","en","ar"]:
                  try:
                      choices=api.fetch(vid, languages=[code])
                      print("SELECTED",code)
                      break
                  except Exception:
                      pass
              if not choices:
                  for t in ts:
                      choices=t.fetch()
                      print("SELECTED",t.language_code)
                      break
              data=[{"text":x.text,"start":x.start,"duration":x.duration} for x in choices]
              open("transcript.json","w",encoding="utf-8").write(json.dumps(data,ensure_ascii=False,indent=2))
              for x in data: print(f"{x['start']:.2f}\t{x['duration']:.2f}\t{x['text']}")
          except Exception as e:
              print("ERROR",type(e).__name__,str(e))
              open("transcript.json","w").write(json.dumps({"error":str(e)}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kalma-transcript
          path: transcript.json
